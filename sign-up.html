<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CareerHatch – Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #003b73;
      --sky: #1c8dff;
      --sea: #038cfc;
      --bg: #f4f8fc;
      --white: #ffffff;
      --radius: 14px;
      --shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: #222;
    }

    .signup-container {
      max-width: 800px;
      margin: 60px auto;
      background: var(--white);
      padding: 40px 30px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .signup-container h2 {
      text-align: center;
      font-size: 28px;
      color: var(--navy);
      margin-bottom: 30px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--navy);
    }

    input,
    select {
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid #ccd9f1;
      font-size: 15px;
    }

    button[type="submit"] {
      grid-column: 1 / -1;
      padding: 14px;
      background: linear-gradient(to right, var(--sea), var(--sky));
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s ease;
    }

    button[type="submit"]:hover {
      background: linear-gradient(to right, var(--sky), var(--sea));
    }

    .login-link {
      grid-column: 1 / -1;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }

    .login-link a {
      color: var(--sky);
      font-weight: 600;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-top: 60px;
    }

    @media (max-width: 600px) {
      form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <section class="signup-container">
    <h2>Create Your CareerHatch Account</h2>
    <form action="submit_signup.php" method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required />
      </div>

      <div class="form-group">
        <label for="field">Field of Study</label>
        <select id="field" name="field" required>
          <option value="">-- Select Field of Study --</option>
          <option>Information Technology</option>
          <option>Computer Science</option>
          <option>Nursing</option>
          <option>Marine Engineering</option>
          <option>Business Administration</option>
          <option>Education</option>
          <option>Criminology</option>
          <option>Hospitality Management</option>
          <option>Electrical Technology</option>
          <option>Automotive Technology</option>
          <option>HRM / Tourism</option>
          <option>Architecture / Engineering</option>
          <option>Multimedia Arts</option>
          <option>Others</option>
        </select>
      </div>

      <div class="form-group">
        <label for="birthdate">Birthdate</label>
        <input type="date" id="birthdate" name="birthdate" required />
      </div>

      <div class="form-group full-width">
        <label for="idupload">Upload Valid ID (Government or School)</label>
        <input type="file" id="idupload" name="idupload" accept="image/*,.pdf" required />
      </div>

      <button type="submit">Sign Up</button>

      <div class="login-link">
        Already have an account? <a href="/Jobseeking/Login/Login.html">Log in here</a>
      </div>
    </form>
  </section>

  <footer>
    &copy; 2025 CareerHatch – Empowering Honest Jobseekers
  </footer>

</body>
</html>
