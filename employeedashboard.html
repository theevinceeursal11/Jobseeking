<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Settings - CareerHatch</title>
<style>
  :root {
    --primary: #1c8dff;
    --secondary: #003b73;
    --bg: #eef3f8;
    --card-bg: #fff;
    --shadow: rgba(0,0,0,0.08);
    --radius: 12px;
  }

  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: #333;
  }

  .container {
    max-width: 1000px;
    margin: 40px auto;
    background: var(--card-bg);
    padding: 30px;
    border-radius: var(--radius);
    box-shadow: 0 8px 16px var(--shadow);
  }

  .back-link {
    display: inline-block;
    margin-bottom: 16px;
    color: #3182ce;
    font-weight: 600;
    text-decoration: none;
    font-size: 15px;
  }

  .back-link:hover {
    color: #2b6cb0;
  }

  h1 {
    color: var(--secondary);
    font-size: 26px;
    margin-bottom: 20px;
  }

  form {
    display: grid;
    gap: 25px;
  }

  .card {
    background: #f7f9fc;
    padding: 20px;
    border-radius: var(--radius);
    box-shadow: 0 4px 12px var(--shadow);
  }

  .card h2 {
    margin-top: 0;
    color: var(--secondary);
    font-size: 20px;
    margin-bottom: 15px;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 14px;
  }

  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="file"],
  textarea,
  select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  .profile-pic-container {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .profile-pic-container img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--secondary);
  }

  .save-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 14px 22px;
    font-size: 16px;
    font-weight: 600;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .save-btn:hover {
    background: #0f70d0;
  }

  @media (max-width: 768px) {
    .profile-pic-container {
      flex-direction: column;
      align-items: flex-start;
    }

    .profile-pic-container img {
      margin-bottom: 10px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <a href="job-huntingpage.html" class="back-link">← Back</a>
  <h1>Profile Settings</h1>
  <form id="profile-form">

    <!-- Profile Picture & Basic Info -->
    <div class="card">
      <h2>Basic Information</h2>
      <div class="profile-pic-container">
        <img src="https://via.placeholder.com/100" alt="Profile Picture" id="profile-preview">
        <div>
          <label for="profile-pic">Upload Profile Picture</label>
          <input type="file" id="profile-pic" accept="image/*">
        </div>
      </div>
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Juan Dela Cruz" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="juan@example.com" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="+63 912 345 6789">
    </div>

    <!-- Address & Location -->
    <div class="card">
      <h2>Address & Location</h2>
      <label for="street">Street</label>
      <input type="text" id="street" placeholder="Don Gil Garcia St.">

      <label for="city">City</label>
      <input type="text" id="city" placeholder="Cebu City">

      <label for="province">Province</label>
      <input type="text" id="province" placeholder="Cebu">

      <label for="country">Country</label>
      <input type="text" id="country" placeholder="Philippines">
    </div>

    <!-- Professional Details -->
    <div class="card">
      <h2>Professional Details</h2>
      <label for="position">Current Position / Job Title</label>
      <input type="text" id="position" placeholder="Junior Web Developer">

      <label for="skills">Skills (comma separated)</label>
      <input type="text" id="skills" placeholder="HTML, CSS, JavaScript">

      <label for="experience">Experience</label>
      <textarea id="experience" placeholder="Describe your experience..."></textarea>

      <label for="education">Education</label>
      <input type="text" id="education" placeholder="Bachelor of Science in Computer Science">
    </div>

    <!-- Resume & Documents -->
    <div class="card">
      <h2>Resume & Documents</h2>
      <label for="resume">Upload Resume / CV</label>
      <input type="file" id="resume" accept=".pdf,.doc,.docx">

      <label for="certificates">Upload Certificates (optional)</label>
      <input type="file" id="certificates" accept=".pdf,.jpg,.png" multiple>
    </div>

    <!-- Save Button -->
    <button type="submit" class="save-btn">Save Profile</button>

  </form>
</div>

<script>
  // Preview profile picture
  const profileInput = document.getElementById('profile-pic');
  const profilePreview = document.getElementById('profile-preview');

  profileInput.addEventListener('change', function(){
    const file = this.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = function(e){
        profilePreview.setAttribute('src', e.target.result);
      }
      reader.readAsDataURL(file);
    }
  });

  // Handle form submission
  document.getElementById('profile-form').addEventListener('submit', function(e){
    e.preventDefault();
    alert('Profile saved successfully!');
    // Here you can add code to save form data to backend
  });
</script>

</body>
</html>
